name: Benchmarks

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      benchmark_tags:
        description: 'Benchmark all release tags (builds historical data)'
        type: boolean
        default: false

permissions: {}

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Push ASV results back to main
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0  # Full history for ASV
          persist-credentials: true  # Needed by "Commit benchmark results"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv

      - name: Configure git for ASV
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Setup ASV machine
        working-directory: asv_benchmarks
        run: asv machine --machine github-actions --yes

      - name: Run benchmarks
        working-directory: asv_benchmarks
        env:
          BENCHMARK_TAGS: ${{ inputs.benchmark_tags }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$BENCHMARK_TAGS" = "true" ]; then
            # Benchmark all release tags for historical data
            for tag in $(git tag --sort=version:refname); do
              echo "Benchmarking $tag..."
              asv run --machine github-actions --quick "$tag^!" || true
            done
          elif [ "$EVENT_NAME" = "release" ]; then
            # Benchmark the release tag
            asv run --machine github-actions --quick "$RELEASE_TAG^!"
          else
            # Manual dispatch without tags: benchmark HEAD
            asv run --machine github-actions --quick HEAD^!
          fi

      - name: Commit benchmark results
        run: |
          git add asv_benchmarks/.asv/results/
          git diff --staged --quiet || \
            git commit -m "ci(benchmarks): update ASV results [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Generate HTML report
        working-directory: asv_benchmarks
        run: asv publish

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: asv_benchmarks/.asv/html

  deploy:
    needs: benchmark
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
