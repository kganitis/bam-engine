name: Repo Review

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/**'
      - 'LICENSE'
      - 'README.rst'
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - '.github/**'
      - 'LICENSE'
      - 'README.rst'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: scientific-python/repo-review@91fa00fc79af75f7931c18f2c3f1aca660ca7b1c # v1.3.0
        with:
          plugins: sp-repo-review
